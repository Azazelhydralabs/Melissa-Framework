[workspace]
resolver = "3"
members = ["crates/core-contracts", "crates/local-store", "crates/windows-executor", "crates/execution-broker", "crates/container-executor", "crates/model-gateway", "crates/repository", "crates/build-test", "crates/skill-context", "crates/workflow", "crates/recovery", "crates/web-development"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup", "limits", "fallible_uint"] }
blake3 = "=1.8.7"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
getrandom = "=0.4.3"
zeroize = "=1.9.0"
tempfile = "=3.27.0"
windows-sys = "=0.61.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
futures-util = "=0.3.34"
url = "=2.5.8"
jsonschema = { version = "=0.58.3", default-features = false }

