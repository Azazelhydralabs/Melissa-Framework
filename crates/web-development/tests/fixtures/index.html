<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owned notes</title>
<style>*{box-sizing:border-box}body{font:18px system-ui;margin:0;padding:24px}main{max-width:650px;margin:auto}label,input,button{display:block}input,button{font:inherit;padding:10px;max-width:100%;width:100%}form{display:grid;gap:12px}form[hidden]{display:none}button{cursor:pointer}li{overflow-wrap:anywhere}:focus-visible{outline:3px solid blue}</style>
<main><h1>Notes</h1><form id="login"><label for="user">User</label><input id="user" required><button id="sign-in">Sign in</button></form>
<form id="notes" hidden><label for="text">Note</label><input id="text" required maxlength="200"><button id="save">Save</button></form>
<p id="status" role="status">Sign in to continue</p><ul id="items"></ul></main>
<script>
const statusNode=document.querySelector('#status'),items=document.querySelector('#items');
async function refresh(){const r=await fetch('/api/notes');if(!r.ok)throw Error('Load failed');const body=await r.json();items.replaceChildren(...body.items.map(item=>{const li=document.createElement('li');li.textContent=item.text;return li}));statusNode.textContent=body.items.length?'Saved':'No notes yet'}
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();statusNode.textContent='Loading';try{const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:document.querySelector('#user').value})});if(!r.ok)throw Error('Sign in failed');document.querySelector('#login').hidden=true;document.querySelector('#notes').hidden=false;await refresh();document.querySelector('#text').focus()}catch(e){statusNode.textContent=e.message}});
document.querySelector('#notes').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#save');button.disabled=true;statusNode.textContent='Saving';try{const r=await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json','idempotency-key':crypto.randomUUID()},body:JSON.stringify({text:document.querySelector('#text').value})});if(!r.ok)throw Error('Save failed');await refresh();document.querySelector('#text').value='';document.querySelector('#text').focus()}catch(e){statusNode.textContent=e.message}finally{button.disabled=false}});
</script></html>
