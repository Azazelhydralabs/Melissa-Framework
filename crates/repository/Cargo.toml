[package]
name = "melissa-repository"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
melissa-core-contracts = { path = "../core-contracts" }
melissa-local-store = { path = "../local-store" }
melissa-container-executor = { path = "../container-executor" }
melissa-execution-broker = { path = "../execution-broker" }
melissa-model-gateway = { path = "../model-gateway" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
getrandom.workspace = true
tree-sitter = "=0.27.1"
tree-sitter-rust = "=0.24.2"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_System_IO", "Win32_Security"] }
ignore = "=0.4.33"
globset = "=0.4.20"
memchr = "=2.8.3"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"

[dev-dependencies]
tempfile.workspace = true
zeroize.workspace = true
windows-sys = { workspace = true, features = ["Win32_Security_Cryptography"] }
